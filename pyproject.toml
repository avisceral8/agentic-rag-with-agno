[project]
name = "agentic-rag"
version = "0.1.0"
description = "Agentic RAG with Chainlit, Agno, Chonkie, and LanceDB"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agno>=1.3.3",
    "chainlit>=2.5.5",
    "chonkie[all]>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sentence-transformers>=3.0.0",
    "openai>=1.75.0",
    "lancedb>=0.17.0",
    "python-dotenv>=1.0.0",
    "pyarrow>=17.0.0",
]